# Nginx site for AdPulse. deploy.sh fills in __DOMAIN__ and __WEB_ROOT__ and
# installs it as /etc/nginx/sites-available/adpulse. Certbot then adds the
# HTTPS (443) server block and the HTTP -> HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # `current` is a symlink to the active release, swapped atomically on deploy.
    root __WEB_ROOT__/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets have content-hashed names, so they can be cached forever.
    # (add_header in a location replaces the server-level ones, so repeat them.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Always revalidate the entry page so a new deploy shows up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Never serve dotfiles (.env, .git, ...) even if one ends up in the web root.
    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Optional password protection – see "Keep it private" in the README.
    # auth_basic "AdPulse";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
